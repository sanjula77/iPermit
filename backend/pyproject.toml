[tool.ruff]
line-length = 88
target-version = "py311"
# Alembic autogenerates these; applied migrations are never hand-edited.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-in-default-args is the framework's idiomatic pattern.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder otherwise makes ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "alembic/versions"

[tool.pytest.ini_options]
pythonpath = ["."]
