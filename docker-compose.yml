services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipermit
      POSTGRES_PASSWORD: ipermit
      POSTGRES_DB: ipermit
    ports:
      - "5432:5432"
    volumes:
      # Bind mounts (not named volumes) so data survives Docker prunes/resets.
      - ./.data/pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: on first init the entrypoint runs a temporary socket-only
      # server; a socket check reports it ready before the real one is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ipermit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      # Local wheelhouse (see Dockerfile) -- passed as a separate build
      # context so the large wheel files aren't sent with ./backend.
      additional_contexts:
        wheels: ./backend-wheels
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./.data/insightface:/root/.insightface
