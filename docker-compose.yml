services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipermit
      POSTGRES_PASSWORD: ipermit
      POSTGRES_DB: ipermit
    ports:
      - "5432:5432"
    volumes:
      - ipermit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipermit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ipermit_face_models:/root/.insightface

volumes:
  ipermit_pgdata:
  ipermit_face_models:
