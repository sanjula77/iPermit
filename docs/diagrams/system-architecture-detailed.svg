<svg viewBox="0 0 1360 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>iPermit Deployment Architecture</title>
  <desc>Browser and mobile clients reach a public route inside the Docker Compose application container, which fronts client applications (Admin Web, Mobile App). Requests pass through a single FastAPI API Router to backend route groups (Applications, Police and Violations, Admin Review, Notifications, Face Recognition, and a planned Violation Detection module), backed by Auth as a common cross-cutting service, and persisted in PostgreSQL and, for face templates, a separate SQLite plus FAISS store.</desc>

  <defs>
    <marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="a-dark-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1360" height="800" fill="#ffffff"/>

  <text x="680" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">iPermit Deployment Architecture</text>

  <!-- ===================== Actors ===================== -->
  <g>
    <rect x="45" y="185" width="70" height="70" rx="12" fill="#c9962c"/>
    <rect x="61" y="203" width="38" height="30" rx="3" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <line x1="61" y1="211" x2="99" y2="211" stroke="#ffffff" stroke-width="1.6"/>
    <circle cx="66" cy="207" r="1.3" fill="#ffffff"/>
    <text x="80" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">BROWSER</text>
    <text x="80" y="286" text-anchor="middle" font-size="11" fill="#6b7280">Admin</text>
  </g>

  <g>
    <rect x="45" y="365" width="70" height="70" rx="12" fill="#c9962c"/>
    <rect x="71" y="381" width="18" height="34" rx="4" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <circle cx="80" cy="410" r="1.6" fill="#ffffff"/>
    <text x="80" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">MOBILE</text>
    <text x="80" y="466" text-anchor="middle" font-size="11" fill="#6b7280">Driver / Police</text>
  </g>

  <!-- ===================== Outer + inner containers ===================== -->
  <rect x="170" y="45" width="1160" height="715" rx="10" fill="#f3f8fe" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="188" y="66" font-size="12.5" font-weight="700" fill="#1e3a5f" letter-spacing="0.3">IPERMIT PLATFORM</text>

  <rect x="190" y="90" width="1120" height="655" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3" stroke-dasharray="4,4"/>
  <text x="206" y="109" font-size="11.5" font-weight="700" fill="#3b82f6" letter-spacing="0.3">APPLICATION CONTAINER — FastAPI (single service)</text>

  <!-- ===================== Public Route column ===================== -->
  <rect x="210" y="135" width="100" height="545" rx="8" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="260" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151" letter-spacing="0.3">PUBLIC ROUTE</text>

  <g>
    <circle cx="260" cy="300" r="30" fill="#16a085"/>
    <path d="M246 292 A16 16 0 0 1 274 292" fill="none" stroke="#ffffff" stroke-width="2.6"/>
    <polygon points="274,292 267,290 271,283" fill="#ffffff"/>
    <path d="M274 308 A16 16 0 0 1 246 308" fill="none" stroke="#ffffff" stroke-width="2.6"/>
    <polygon points="246,308 253,310 249,317" fill="#ffffff"/>
    <text x="260" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Public Route</text>
    <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#6b7280">HTTP :8000</text>
  </g>

  <!-- ===================== Client Applications box ===================== -->
  <rect x="330" y="135" width="230" height="310" rx="8" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="445" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#374151" letter-spacing="0.3">CLIENT APPLICATIONS</text>

  <g>
    <circle cx="445" cy="225" r="26" fill="#c9962c"/>
    <rect x="431" y="212" width="28" height="20" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="431" y1="219" x2="459" y2="219" stroke="#ffffff" stroke-width="1.3"/>
    <text x="445" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Admin Web</text>
    <text x="445" y="275" text-anchor="middle" font-size="10.5" fill="#6b7280">Next.js dashboard</text>
  </g>

  <g>
    <circle cx="445" cy="350" r="26" fill="#c9962c"/>
    <rect x="435" y="336" width="20" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="445" cy="360" r="1.6" fill="#ffffff"/>
    <text x="445" y="385" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Mobile App</text>
    <text x="445" y="400" text-anchor="middle" font-size="10.5" fill="#6b7280">Expo / React Native</text>
  </g>

  <!-- ===================== Common Services box ===================== -->
  <rect x="330" y="475" width="230" height="115" rx="8" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="445" y="493" text-anchor="middle" font-size="11" font-weight="700" fill="#374151" letter-spacing="0.3">COMMON SERVICES</text>

  <g>
    <circle cx="445" cy="540" r="26" fill="#c0392b"/>
    <rect x="435" y="538" width="20" height="15" rx="2.5" fill="#ffffff"/>
    <path d="M438 538 v-5 a7 7 0 0 1 14 0 v5" fill="none" stroke="#ffffff" stroke-width="2.6"/>
    <circle cx="445" cy="545" r="1.6" fill="#c0392b"/>
    <text x="445" y="575" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Auth</text>
    <text x="445" y="590" text-anchor="middle" font-size="10.5" fill="#6b7280">JWT + RBAC</text>
  </g>

  <!-- ===================== API Router hub ===================== -->
  <g>
    <circle cx="620" cy="410" r="34" fill="#2563eb"/>
    <circle cx="620" cy="410" r="3.4" fill="#ffffff"/>
    <line x1="620" y1="410" x2="620" y2="396" stroke="#ffffff" stroke-width="2"/>
    <circle cx="620" cy="394" r="2.4" fill="#ffffff"/>
    <line x1="620" y1="410" x2="608" y2="418" stroke="#ffffff" stroke-width="2"/>
    <circle cx="605" cy="420" r="2.4" fill="#ffffff"/>
    <line x1="620" y1="410" x2="632" y2="418" stroke="#ffffff" stroke-width="2"/>
    <circle cx="635" cy="420" r="2.4" fill="#ffffff"/>
    <line x1="620" y1="410" x2="608" y2="402" stroke="#ffffff" stroke-width="2"/>
    <circle cx="605" cy="400" r="2.4" fill="#ffffff"/>
    <line x1="620" y1="410" x2="632" y2="402" stroke="#ffffff" stroke-width="2"/>
    <circle cx="635" cy="400" r="2.4" fill="#ffffff"/>
    <text x="620" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">API Router</text>
    <text x="620" y="471" text-anchor="middle" font-size="10" fill="#6b7280">FastAPI routing</text>
  </g>

  <!-- ===================== Backend Services box ===================== -->
  <rect x="690" y="130" width="250" height="590" rx="8" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="815" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#374151" letter-spacing="0.3">BACKEND SERVICES (route groups)</text>

  <!-- Applications -->
  <g>
    <circle cx="815" cy="205" r="24" fill="#c9962c"/>
    <path d="M804 192 h14 l4 4 v20 h-22 v-24 z" fill="#ffffff"/>
    <line x1="807" y1="203" x2="819" y2="203" stroke="#c9962c" stroke-width="1.3"/>
    <line x1="807" y1="208" x2="819" y2="208" stroke="#c9962c" stroke-width="1.3"/>
    <line x1="807" y1="213" x2="815" y2="213" stroke="#c9962c" stroke-width="1.3"/>
    <text x="847" y="200" font-size="12.5" font-weight="700" fill="#111827">Applications</text>
    <text x="847" y="215" font-size="10.5" fill="#6b7280">Submission &amp; review</text>
  </g>

  <!-- Police & Violations -->
  <g>
    <circle cx="815" cy="295" r="24" fill="#c9962c"/>
    <path d="M815 283 l9 3.5 v9 q0 8 -9 11 q-9 -3 -9 -11 v-9 z" fill="#ffffff"/>
    <line x1="815" y1="289" x2="815" y2="298" stroke="#c9962c" stroke-width="1.8"/>
    <circle cx="815" cy="302" r="1.3" fill="#c9962c"/>
    <text x="847" y="290" font-size="12.5" font-weight="700" fill="#111827">Police &amp; Violations</text>
    <text x="847" y="305" font-size="10.5" fill="#6b7280">Verification, points, fines</text>
  </g>

  <!-- Admin Review -->
  <g>
    <circle cx="815" cy="385" r="24" fill="#c9962c"/>
    <path d="M804 386 l6 7 l14 -16" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="847" y="380" font-size="12.5" font-weight="700" fill="#111827">Admin Review</text>
    <text x="847" y="395" font-size="10.5" fill="#6b7280">Appeals &amp; badges</text>
  </g>

  <!-- Notifications -->
  <g>
    <circle cx="815" cy="475" r="24" fill="#c9962c"/>
    <path d="M815 462 q7 0 7 9 v5 q0 3 3 5 h-20 q3 -2 3 -5 v-5 q0 -9 7 -9 z" fill="#ffffff"/>
    <circle cx="815" cy="484" r="2.2" fill="#ffffff"/>
    <text x="847" y="470" font-size="12.5" font-weight="700" fill="#111827">Notifications</text>
    <text x="847" y="485" font-size="10.5" fill="#6b7280">In-app + Expo push</text>
  </g>

  <!-- Face Recognition (implemented AI) -->
  <g>
    <circle cx="815" cy="565" r="24" fill="#16a085"/>
    <circle cx="815" cy="563" r="9" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="811.5" cy="560.5" r="1.1" fill="#ffffff"/>
    <circle cx="818.5" cy="560.5" r="1.1" fill="#ffffff"/>
    <path d="M801 552 v-4 h4 M829 552 v-4 h-4 M801 578 v4 h4 M829 578 v4 h-4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="847" y="560" font-size="12.5" font-weight="700" fill="#111827">Face Recognition</text>
    <text x="847" y="575" font-size="10.5" fill="#6b7280">RetinaFace + ArcFace</text>
  </g>

  <!-- Violation Detection (planned, not built) -->
  <g>
    <circle cx="815" cy="655" r="24" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="803" y="654" width="20" height="8" rx="2" fill="#9ca3af"/>
    <path d="M807 654 l3 -5 h10 l3 5" fill="#9ca3af"/>
    <circle cx="807" cy="663" r="2" fill="#6b7280"/>
    <circle cx="821" cy="663" r="2" fill="#6b7280"/>
    <text x="847" y="650" font-size="12.5" font-weight="700" fill="#111827">Violation Detection</text>
    <text x="847" y="665" font-size="10.5" fill="#b45309">Planned — not yet built</text>
  </g>

  <!-- ===================== Database Services box ===================== -->
  <rect x="1030" y="130" width="230" height="590" rx="8" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1145" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#374151" letter-spacing="0.3">DATABASE SERVICES</text>

  <!-- PostgreSQL cylinder -->
  <g>
    <path d="M1112 302 a22 8 0 0 1 44 0 v54 a22 8 0 0 1 -44 0 z" fill="#2e6da4" stroke="#1e4e79" stroke-width="1.3"/>
    <ellipse cx="1134" cy="302" rx="22" ry="8" fill="#3f82c0" stroke="#1e4e79" stroke-width="1.3"/>
    <text x="1145" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">PostgreSQL</text>
    <text x="1145" y="405" text-anchor="middle" font-size="10.5" fill="#6b7280">Primary DB, Alembic</text>
  </g>

  <!-- SQLite + FAISS cylinder -->
  <g>
    <path d="M1112 545 a22 8 0 0 1 44 0 v54 a22 8 0 0 1 -44 0 z" fill="#2e6da4" stroke="#1e4e79" stroke-width="1.3"/>
    <ellipse cx="1134" cy="545" rx="22" ry="8" fill="#3f82c0" stroke="#1e4e79" stroke-width="1.3"/>
    <text x="1145" y="633" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">SQLite + FAISS</text>
    <text x="1145" y="648" text-anchor="middle" font-size="10.5" fill="#6b7280">Face templates</text>
  </g>

  <!-- ===================== Arrows ===================== -->
  <!-- Actors -> Public Route -->
  <line x1="115" y1="230" x2="235" y2="292" stroke="#374151" stroke-width="1.4" marker-end="url(#a-dark)"/>
  <line x1="115" y1="405" x2="235" y2="315" stroke="#374151" stroke-width="1.4" marker-end="url(#a-dark)"/>

  <!-- Public Route <-> Client Applications -->
  <line x1="291" y1="298" x2="330" y2="285" stroke="#374151" stroke-width="1.4" marker-end="url(#a-dark)" marker-start="url(#a-dark-rev)"/>

  <!-- Client Applications -> API Router -->
  <line x1="560" y1="330" x2="590" y2="400" stroke="#374151" stroke-width="1.4" marker-end="url(#a-dark)" marker-start="url(#a-dark-rev)"/>

  <!-- Auth <-> Backend Services (dashed, cross-cutting) -->
  <line x1="560" y1="532" x2="690" y2="532" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#a-gray)" marker-start="url(#a-gray)"/>

  <!-- API Router -> Backend Services (fan-out) -->
  <line x1="654" y1="410" x2="791" y2="205" stroke="#374151" stroke-width="1.3" marker-end="url(#a-dark)"/>
  <line x1="654" y1="410" x2="791" y2="295" stroke="#374151" stroke-width="1.3" marker-end="url(#a-dark)"/>
  <line x1="654" y1="410" x2="791" y2="385" stroke="#374151" stroke-width="1.3" marker-end="url(#a-dark)"/>
  <line x1="654" y1="410" x2="791" y2="475" stroke="#374151" stroke-width="1.3" marker-end="url(#a-dark)"/>
  <line x1="654" y1="410" x2="791" y2="565" stroke="#374151" stroke-width="1.3" marker-end="url(#a-dark)"/>

  <!-- Backend Services -> Databases -->
  <line x1="839" y1="205" x2="1112" y2="300" stroke="#374151" stroke-width="1.1" marker-end="url(#a-dark)"/>
  <line x1="839" y1="295" x2="1112" y2="315" stroke="#374151" stroke-width="1.1" marker-end="url(#a-dark)"/>
  <line x1="839" y1="385" x2="1112" y2="330" stroke="#374151" stroke-width="1.1" marker-end="url(#a-dark)"/>
  <line x1="839" y1="475" x2="1112" y2="345" stroke="#374151" stroke-width="1.1" marker-end="url(#a-dark)"/>
  <line x1="839" y1="565" x2="1112" y2="565" stroke="#374151" stroke-width="1.4" marker-end="url(#a-dark)"/>

  <!-- ===================== Legend ===================== -->
  <g>
    <rect x="190" y="758" width="1120" height="34" fill="#ffffff"/>
    <circle cx="210" cy="775" r="9" fill="#c9962c"/>
    <text x="228" y="775" dominant-baseline="central" font-size="11" fill="#374151">Client-facing / route groups</text>
    <circle cx="470" cy="775" r="9" fill="#16a085"/>
    <text x="488" y="775" dominant-baseline="central" font-size="11" fill="#374151">Implemented AI module</text>
    <circle cx="700" cy="775" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="3,2"/>
    <text x="718" y="775" dominant-baseline="central" font-size="11" fill="#374151">Planned, not yet built</text>
    <circle cx="930" cy="775" r="9" fill="#c0392b"/>
    <text x="948" y="775" dominant-baseline="central" font-size="11" fill="#374151">Cross-cutting security</text>
  </g>
</svg>
