<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>iPermit System Architecture</title>
  <desc>Component diagram: Mobile App and Admin Web Dashboard clients call the API Backend, which orchestrates the Face Recognition Module (implemented), the Violation Detection Module (planned, not yet implemented), the Primary Database, and the Notification Service. The Face Recognition Module persists templates in a separate Face Template Store.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <text x="600" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">iPermit System Architecture</text>
  <text x="600" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Component map, per docs/design.md</text>

  <!-- Tier 1: Clients -->
  <g>
    <rect x="140" y="75" width="220" height="70" rx="10" fill="#eaf2fb" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="250" y="102" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#111827">Mobile App</text>
    <text x="250" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#374151">Driver &amp; police UI (Expo/RN)</text>
  </g>

  <g>
    <rect x="840" y="75" width="260" height="70" rx="10" fill="#eaf2fb" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="970" y="102" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#111827">Admin Web Dashboard</text>
    <text x="970" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#374151">Application &amp; appeal review (Next.js)</text>
  </g>

  <!-- Tier 2: API Backend -->
  <g>
    <rect x="465" y="225" width="270" height="100" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>
    <text x="600" y="252" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#111827">API Backend</text>
    <text x="600" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#374151">FastAPI — auth, business rules</text>
    <text x="600" y="302" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#6b7280" font-family="monospace">/auth /applications /admin /police</text>
  </g>

  <!-- Tier 3: Modules, DB, Notifications -->
  <g>
    <rect x="100" y="475" width="220" height="70" rx="10" fill="#eaf2fb" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="210" y="502" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#111827">Face Recognition Module</text>
    <text x="210" y="524" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#374151">RetinaFace + ArcFace, ONNX</text>
  </g>

  <g>
    <rect x="360" y="475" width="235" height="70" rx="10" fill="#fef3e2" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="477" y="502" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#78350f">Violation Detection Module</text>
    <text x="477" y="524" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#92400e">Planned — not yet built</text>
  </g>

  <g>
    <rect x="635" y="475" width="230" height="70" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="750" y="502" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#111827">Primary Database</text>
    <text x="750" y="524" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#374151">PostgreSQL, Alembic migrations</text>
  </g>

  <g>
    <rect x="905" y="475" width="190" height="70" rx="10" fill="#eaf2fb" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="1000" y="502" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#111827">Notification Service</text>
    <text x="1000" y="524" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#374151">Expo push + in-app</text>
  </g>

  <!-- Tier 4: Face Template Store -->
  <g>
    <rect x="120" y="605" width="180" height="64" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
    <text x="210" y="629" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#111827">Face Template Store</text>
    <text x="210" y="649" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#374151">SQLite + FAISS index</text>
  </g>

  <!-- Arrows: clients -> API Backend -->
  <line x1="250" y1="145" x2="550" y2="225" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="970" y1="145" x2="650" y2="225" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="172" width="118" height="18" fill="#ffffff"/>
  <text x="389" y="181" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#6b7280">REST/JSON, JWT</text>
  <rect x="752" y="172" width="118" height="18" fill="#ffffff"/>
  <text x="811" y="181" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#6b7280">REST/JSON, JWT</text>

  <!-- Arrows: API Backend -> tier 3 -->
  <line x1="500" y1="325" x2="210" y2="475" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="325" x2="477" y2="475" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
  <line x1="650" y1="325" x2="750" y2="475" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="325" x2="1000" y2="475" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="115" y="395" width="130" height="18" fill="#ffffff"/>
  <text x="180" y="404" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#6b7280">in-process call</text>
  <rect x="460" y="415" width="130" height="18" fill="#ffffff"/>
  <text x="525" y="424" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#92400e">in-process call</text>
  <rect x="655" y="395" width="110" height="18" fill="#ffffff"/>
  <text x="710" y="404" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#6b7280">SQLAlchemy</text>
  <rect x="880" y="395" width="150" height="18" fill="#ffffff"/>
  <text x="955" y="404" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#6b7280">best-effort call</text>

  <!-- Arrow: Face Recognition -> Face Template Store -->
  <line x1="210" y1="545" x2="210" y2="605" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="215" y="565" width="140" height="18" fill="#ffffff"/>
  <text x="285" y="574" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#6b7280">template read/write</text>

  <!-- Legend -->
  <g>
    <rect x="100" y="710" width="1000" height="80" rx="8" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
    <text x="120" y="732" font-size="12" font-weight="700" fill="#111827">Legend</text>

    <rect x="120" y="748" width="26" height="16" rx="4" fill="#eaf2fb" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="156" y="756" dominant-baseline="central" font-size="11.5" fill="#374151">Implemented (Phases 1–8, this build)</text>

    <rect x="500" y="748" width="26" height="16" rx="4" fill="#fef3e2" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="536" y="756" dominant-baseline="central" font-size="11.5" fill="#92400e">Designed, not yet built — deferred (tasks.md 5.4)</text>
  </g>
</svg>
